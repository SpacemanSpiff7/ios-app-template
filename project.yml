# XcodeGen spec — the ONLY source of truth for the Xcode project, Info.plist
# keys, and version/build numbers. Run `xcodegen generate` after editing.
name: __APP_NAME__
options:
  bundleIdPrefix: __BUNDLE_PREFIX__
  deploymentTarget:
    iOS: "__MIN_IOS__"
  xcodeVersion: "__XCODE_VERSION__"
  developmentLanguage: en
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: false

settings:
  base:
    DEVELOPMENT_TEAM: __TEAM_ID__
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: "YES"
    SWIFT_UPCOMING_FEATURE_EXISTENTIAL_ANY: "YES"
    SWIFT_EMIT_LOC_STRINGS: "YES"
    ENABLE_USER_SCRIPT_SANDBOXING: "YES"
    SUPPORTS_MACCATALYST: "NO"
    SUPPORTS_MAC_DESIGNED_FOR_IPHONE: "NO"
    TARGETED_DEVICE_FAMILY: "1"
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: "YES"
  configs:
    Debug:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG

packages:
  AppKit:
    path: Packages/AppKit

targets:
  __APP_NAME__:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes: ["**/.DS_Store", "**/CLAUDE.md"]
    dependencies:
      - package: AppKit
        products: [Core, Domain, Persistence, DesignSystem, Features]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: __BUNDLE_ID__
        # XcodeGen's target preset overrides the project setting unless repeated here.
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: __DISPLAY_NAME__
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UILaunchScreen: {}
        # Add every usage description here (NEVER in Info.plist directly), e.g.
        # NSHealthShareUsageDescription: ...
        # And if you declare a capability in UIRequiredDeviceCapabilities, surface
        # the feature in-app or App Review rejects under 2.5.1 (see docs/RELEASE.md).

  __APP_NAME__Tests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: AppTests
    dependencies:
      - target: __APP_NAME__
      - package: AppKit
        products: [Core, Persistence, DesignSystem, Features]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "YES"
        TARGETED_DEVICE_FAMILY: "1"

schemes:
  __APP_NAME__:
    build:
      targets:
        __APP_NAME__: all
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - __APP_NAME__Tests
        - package: AppKit/CoreTests
        - package: AppKit/DesignSystemTests
    archive:
      config: Release
